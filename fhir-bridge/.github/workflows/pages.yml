# Publishes docs/ (which holds .well-known/jwks.json) to GitHub Pages.
# This is how the EHRs reach your PUBLIC key. No secrets are published.
name: Publish JWKS (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths: [ "docs/**" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
